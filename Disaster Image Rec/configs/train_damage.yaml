# Training configuration for damage classification

task: "damage"
seed: 42
use_gpu: true

# Data configuration
data:
  root: "data"
  image_size: 512

# Model configuration
model:
  encoder: "resnet34"  # resnet34, resnet50, efficientnet-b0, etc.
  pretrained: "imagenet"
  num_classes: 4  # no-damage, minor, major, destroyed
  architecture: "concat"  # concat or siamese

# Training configuration
training:
  epochs: 5  # Reduced for quick demo (was 30)
  batch_size: 8
  num_workers: 4
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # adam or sgd
  loss: "combined"  # ce, dice, focal, or combined

# Output configuration
output:
  checkpoint_dir: "checkpoints/damage"
  log_dir: "logs/damage"
